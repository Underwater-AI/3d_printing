<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Wave icon -->
  <g transform="translate(4, 4)">
    <!-- Outer triangle/wave -->
    <path d="M4 36 L20 4 L36 36" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner wave lines -->
    <path d="M10 28 Q15 22 20 28 Q25 34 30 28" stroke="#00d4ff" stroke-width="1.8" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M12 22 Q17 16 20 22 Q23 28 28 22" stroke="#00d4ff" stroke-width="1.2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <!-- Core dot -->
    <circle cx="20" cy="20" r="3" fill="#00d4ff"/>
  </g>
  <!-- Text: UNDERWATER -->
  <text x="52" y="22" font-family="'Space Mono', 'Courier New', monospace" font-weight="700" font-size="16" fill="#f0f4ff" letter-spacing="0.04em">UNDERWATER</text>
  <!-- Text: AI -->
  <text x="52" y="38" font-family="'Space Mono', 'Courier New', monospace" font-weight="700" font-size="16" fill="#00d4ff" letter-spacing="0.04em">AI</text>
  <!-- Separator line -->
  <line x1="52" y1="26" x2="190" y2="26" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
</svg>
